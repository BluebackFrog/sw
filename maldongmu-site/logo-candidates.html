<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>말동무챗 로고 후보</title>
  <style>
    @font-face{font-family:Pretendard;src:url('assets/pretendard.woff2') format('woff2');font-weight:100 900;font-display:swap}
    *{box-sizing:border-box}body{margin:0;background:#f3efe6;color:#303c30;font-family:Pretendard,'Malgun Gothic',sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #a45f40;outline-offset:5px}h1,h2,p{margin:0}main{width:min(1240px,calc(100% - 64px));margin:48px auto 40px}.page-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:28px}.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:600;color:#76816c;margin-bottom:11px}h1{font-size:34px;letter-spacing:-.055em;font-weight:700}.page-head>p{font-size:14px;color:#7a806f;line-height:1.6;text-align:right}
    .candidates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.candidate{position:relative;text-align:left;background:#fffcf7;border:1px solid #dedfd2;border-radius:20px;padding:22px 26px 20px;transition:border-color .15s,box-shadow .15s}.candidate:hover{border-color:#8a9a7c}.candidate[aria-pressed=true]{border-color:#49654d;box-shadow:inset 0 0 0 1px #49654d}.card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.name{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:650}.number{font-size:12px;color:#7c856d;font-weight:500}.selection{width:20px;height:20px;border:1px solid #cdd1c2;border-radius:50%;display:grid;place-items:center;font-size:12px;color:transparent}.candidate[aria-pressed=true] .selection{background:#49654d;border-color:#49654d;color:#fff}.logo{display:inline-flex;align-items:center;gap:10px;white-space:nowrap}.wordmark{font-size:40px;font-weight:750;letter-spacing:-.045em;line-height:1.25}.wordmark em{color:#9a593a;font-style:normal}.logo-icon{display:inline-block;position:relative;width:76px;height:76px;flex-shrink:0;overflow:hidden}.logo-icon img{display:block;width:100%;height:100%;object-fit:contain}.logo-icon.pair{width:100px;height:65px}.logo-icon.pair img{position:absolute;width:100px;height:100px;top:-18px;max-width:none}.card-logo{height:130px;display:flex;align-items:center;justify-content:center}.description{display:block;font-size:14px;line-height:1.55;color:#717b66;border-top:1px solid #eeeee4;padding-top:15px}
    .preview-title{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:32px 0 14px}.preview-title h2{font-size:18px;font-weight:650;letter-spacing:-.03em}.preview-title p{font-size:13px;color:#7a806f}.site-preview{border:1px solid #dedfd2;border-radius:20px;overflow:hidden;background:#f3eddf}.site-header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px 26px;background:#fffcf7}.site-header .wordmark{font-size:29px}.site-header .logo{gap:8px}.site-header .logo-icon{width:40px;height:40px}.site-header .logo-icon.pair{width:64px;height:40px}.site-header .logo-icon.pair img{width:64px;height:64px;top:-12px}.site-nav{display:flex;align-items:center;gap:30px;font-size:14px;color:#59634f}.nav-cta{color:#fff;background:#49654d;border-radius:24px;padding:12px 20px}.mini-hero{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 44px;height:220px;overflow:hidden}.mini-copy{position:relative;z-index:1}.mini-copy>p{font-size:12px;color:#49654d;margin-bottom:12px}.mini-copy h2{font-size:32px;line-height:1.42;font-weight:650;letter-spacing:-.045em}.mini-copy h2 span{color:#49654d}.mini-hero>img{height:280px;width:390px;object-fit:cover;mix-blend-mode:multiply;mask-image:radial-gradient(ellipse at center,#000 38%,transparent 74%);-webkit-mask-image:radial-gradient(ellipse at center,#000 38%,transparent 74%)}.footnote{margin-top:16px;font-size:12px;color:#7a806f;line-height:1.6}
    @media(max-width:760px){main{width:calc(100% - 32px);margin:28px auto}.page-head{align-items:start;flex-direction:column;gap:12px}.page-head>p{text-align:left}h1{font-size:28px}.candidate{padding:20px}.candidates{grid-template-columns:1fr;gap:14px}.card-logo{height:124px}.wordmark{font-size:35px}.logo-icon{width:64px;height:64px}.logo-icon.pair{width:84px;height:55px}.logo-icon.pair img{width:84px;height:84px;top:-15px}.preview-title{align-items:start;flex-direction:column;gap:8px}.site-header{padding:16px 18px}.site-header .wordmark{font-size:26px}.site-nav{display:none}.mini-hero{height:280px;padding:24px;position:relative;align-items:start}.mini-copy h2{font-size:24px}.mini-hero>img{position:absolute;right:-65px;bottom:-45px;width:280px;height:220px;opacity:.65}.mini-copy{max-width:250px}.footnote{font-size:11px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main>
    <header class="page-head">
      <div><p class="eyebrow">MALDONGMU CHAT · LOGO STUDY</p><h1>어떤 얼굴로 인사할까요?</h1></div>
      <p>같은 글씨와 색상으로 비교한 네 가지 후보<br>카드를 누르면 아래 사이트 상단에 적용해 볼 수 있어요.</p>
    </header>
    <div class="candidates" aria-label="로고 후보 선택">
      <button class="candidate" type="button" data-id="01-boksil" data-name="복실이" aria-pressed="false">
        <span class="card-top"><span class="name"><span class="number">01</span>복실이</span><span class="selection" aria-hidden="true">✓</span></span>
        <span class="card-logo"><span class="logo"><span class="logo-icon"><img src="assets/logo-candidates/01-boksil.png" alt="웃으며 고개를 기울인 강아지"></span><span class="wordmark">말동무<em>챗</em></span></span></span>
        <span class="description">편하게 말을 걸고 싶은 친구 같은 인상</span>
      </button>
      <button class="candidate" type="button" data-id="02-boksoon" data-name="복순 할머니" aria-pressed="true">
        <span class="card-top"><span class="name"><span class="number">02</span>복순 할머니</span><span class="selection" aria-hidden="true">✓</span></span>
        <span class="card-logo"><span class="logo"><span class="logo-icon"><img src="assets/logo-candidates/02-boksoon.png" alt="활짝 웃는 은발의 할머니"></span><span class="wordmark">말동무<em>챗</em></span></span></span>
        <span class="description">반갑게 맞아주는 할머니의 따뜻한 인상</span>
      </button>
      <button class="candidate" type="button" data-id="03-deoksu" data-name="덕수 할아버지" aria-pressed="false">
        <span class="card-top"><span class="name"><span class="number">03</span>덕수 할아버지</span><span class="selection" aria-hidden="true">✓</span></span>
        <span class="card-logo"><span class="logo"><span class="logo-icon"><img src="assets/logo-candidates/03-deoksu.png" alt="둥근 안경을 쓰고 웃는 할아버지"></span><span class="wordmark">말동무<em>챗</em></span></span></span>
        <span class="description">이야기를 잘 들어줄 것 같은 편안한 인상</span>
      </button>
      <button class="candidate" type="button" data-id="04-together" data-name="할머니와 할아버지" aria-pressed="false">
        <span class="card-top"><span class="name"><span class="number">04</span>할머니와 할아버지</span><span class="selection" aria-hidden="true">✓</span></span>
        <span class="card-logo"><span class="logo"><span class="logo-icon pair"><img src="assets/logo-candidates/04-together.png" alt="얼굴을 나란히 맞대고 웃는 할머니와 할아버지"></span><span class="wordmark">말동무<em>챗</em></span></span></span>
        <span class="description">어르신을 위한 서비스라는 의미가 가장 직접적인 인상</span>
      </button>
    </div>
    <div class="preview-title"><h2>사이트 상단에 놓으면</h2><p id="selected-label" aria-live="polite">02 · 복순 할머니</p></div>
    <section class="site-preview" aria-label="선택한 로고의 사이트 적용 예시">
      <div class="site-header"><span class="logo"><span class="logo-icon" id="preview-icon"><img id="preview-image" src="assets/logo-candidates/02-boksoon.png" alt="복순 할머니 로고"></span><span class="wordmark">말동무<em>챗</em></span></span><div class="site-nav" aria-hidden="true"><span>우리의 마음</span><span>말동무 소개</span><span class="nav-cta">우리 가족에게 소개하기 ↗</span></div></div>
      <div class="mini-hero"><div class="mini-copy"><p>통화를 끊고 나서도 마음이 쓰인다면</p><h2>혼자 계신 시간에도<br>말벗이 되어드리는<br><span>채팅 앱, 말동무챗.</span></h2></div><img src="assets/grandparents-watercolor-wide.png" alt="휴대폰을 보며 함께 웃는 할머니와 할아버지"></div>
    </section>
    <p class="footnote">로고 후보 비교용 페이지입니다. 카드 선택은 이 페이지의 미리보기에만 반영됩니다.</p>
  </main>
  <script>
    const cards = document.querySelectorAll('.candidate');
    cards.forEach(card => card.addEventListener('click', () => {
      cards.forEach(item => item.setAttribute('aria-pressed', String(item === card)));
      const image = document.getElementById('preview-image');
      image.src = 'assets/logo-candidates/' + card.dataset.id + '.png';
      image.alt = card.dataset.name + ' 로고';
      document.getElementById('preview-icon').classList.toggle('pair', card.dataset.id === '04-together');
      document.getElementById('selected-label').textContent = card.dataset.id.slice(0, 2) + ' · ' + card.dataset.name;
    }));
  </script>
</body>
</html>
